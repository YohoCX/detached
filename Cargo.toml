[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
detached-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"

# The kit and GPUI are too slow to use unoptimized; workspace crates keep fast debug builds.
[profile.dev.package."*"]
opt-level = 3

# The packages: smaller and a little faster, at a few minutes more of build. Line tables go to a
# .dSYM on macOS, for crash reports' addresses.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
debug = "line-tables-only"
split-debuginfo = "packed"

# `make app`: release speed, incremental so daily rebuilds stay short.
[profile.app]
inherits = "release"
incremental = true
lto = false
codegen-units = 16
strip = false
split-debuginfo = "unpacked"
