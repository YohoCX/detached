[package]
name = "detached-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Plain http to localhost counts as https, for the fake forges. Test builds only.
e2e = []
# `git::testutil::Sandbox` for other crates' tests.
testutil = ["dep:minisign"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
base64 = "0.23"
thiserror = "2"
libc = "0.2"
ureq = { version = "3.5", features = ["json"] }
ignore = "0.4.34"
notify = "8.2.1"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
nucleo-matcher = "0.3.1"
imara-diff = "0.2"
dirs = "7"
open = { version = "5.4", features = ["shellexecute-on-windows"] }
minisign-verify = "0.3"
semver = { version = "1", features = ["serde"] }
# Signs the test feed in `update::testutil`.
minisign = { version = "0.10", optional = true }

[dev-dependencies]
minisign = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4.2"
