[[subject]]
name = "fix-range-commits"
commit = "e2ee81b0a57650cbe910ceeaaace43b6bce13f01"

[subject.bug]
what = "For a triple-dot scope, `git log a...b` lists both sides' commits, so the fix shows commits that are not in it."
message = "Panels: the fix's commits from the scope's range as written"
patch = '''
diff --git a/crates/core/src/panel.rs b/crates/core/src/panel.rs
--- a/crates/core/src/panel.rs
+++ b/crates/core/src/panel.rs
@@ -397,8 +397,7 @@ pub fn fix(core: &AppState, repo: &str, scope: &str) -> Option<Fix> {
     let commits = runner::out(
         &env,
         repo,
-        // `diff a...b` is merge-base..b, whose commits are `log a..b`, not `log a...b`.
-        &["log", "--format=%h", &range.replace("...", ".."), "--"],
+        &["log", "--format=%h", &range, "--"],
         Kind::Read,
     )
     .ok()?;
'''

[[subject]]
name = "folder-backslash"
commit = "38d4f56ea638e65f4661928ede232d440e697f7c"

[subject.bug]
what = "folder_name and in_folder split on `/` only, so a Windows path gets the wrong folder name and membership."
message = "Util: folder_name and in_folder on one separator"
patch = '''
diff --git a/crates/app/src/util.rs b/crates/app/src/util.rs
--- a/crates/app/src/util.rs
+++ b/crates/app/src/util.rs
@@ -8,15 +8,14 @@ pub fn dir_name(p: &str) -> &str {
     p.rsplit_once('/').map_or("", |(d, _)| d)
 }

-/// The last segment of a disk path, which may use `\` on Windows.
 pub fn folder_name(p: &str) -> &str {
-    p.split(['/', '\\']).rfind(|s| !s.is_empty()).unwrap_or(p)
+    p.split('/').rfind(|s| !s.is_empty()).unwrap_or(p)
 }

 /// By path, not `RepoInfo::folder`: a repo listed once may sit in folders of several workspaces.
 pub fn in_folder(path: &str, folder: &str) -> bool {
     path.strip_prefix(folder)
-        .is_some_and(|rest| rest.is_empty() || rest.starts_with(['/', '\\']))
+        .is_some_and(|rest| rest.is_empty() || rest.starts_with('/'))
 }

 #[derive(Clone, Copy, Debug, PartialEq, Eq)]
'''

[[subject]]
name = "watch-made-again"
commit = "2b74ee0ba41cfd51563b8f72dbe14bd40bb66e80"

[subject.bug]
what = "On Linux a directory removed and made again before the batch is read keeps its stale watch, so changes in it are missed."
message = "Core: watch forgets a lost directory only while it is gone"
patch = '''
diff --git a/crates/core/src/watch.rs b/crates/core/src/watch.rs
--- a/crates/core/src/watch.rs
+++ b/crates/core/src/watch.rs
@@ -224,9 +224,8 @@ impl State {
             kind,
             EventKind::Remove(_) | EventKind::Modify(ModifyKind::Name(_))
         );
-        // inotify drops the watch of a directory that went, so one made again there is new; it may
-        // exist again by now.
-        if cfg!(target_os = "linux") && gone {
+        // inotify drops the watch of a directory that went, so one made again there is new.
+        if cfg!(target_os = "linux") && gone && !p.exists() {
             self.git.retain(|k, _| !k.starts_with(p));
             self.work.retain(|k, _| !k.starts_with(p));
         }
'''

[[subject]]
name = "chat-list-stdin"
commit = "385874d77b9d39eba4b96ed79ac206c80d177352"

[subject.bug]
what = "The list run never closes the sidecar's stdin, so its events may never end, and a failed command returns before the list is taken."
message = "Chats: a list run stops at the first failed command"
patch = '''
diff --git a/crates/app/src/chat/list.rs b/crates/app/src/chat/list.rs
--- a/crates/app/src/chat/list.rs
+++ b/crates/app/src/chat/list.rs
@@ -205,8 +205,6 @@ impl ChatList {
                 agent.send(&c);
             }
             agent.send(&Command::Sessions { cwd: String::new() });
-            // Closing stdin lets the sidecar finish these and exit, so `rx` always ends.
-            drop(agent);
             while let Some(e) = rx.next().await {
                 match e {
                     Event::Sessions { sessions } => {
@@ -223,6 +221,8 @@ impl ChatList {
                         cx.update(|cx| {
                             Store::global(cx).update(cx, |s, cx| s.say(message, true, cx))
                         });
+                        // A failed command may never send its reply, and later runs wait on this one.
+                        return;
                     }
                     _ => {}
                 }
'''

