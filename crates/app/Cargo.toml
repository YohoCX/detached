[package]
name = "detached-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "detached"

[[bin]]
name = "detached"
path = "src/main.rs"

[dependencies]
detached-core.workspace = true
kernel = { package = "detached-kernel", path = "../kernel" }
serde.workspace = true
serde_json.workspace = true
# The grammars of the languages the viewer maps file names to.
gpui-kit = { version = "=0.9.0", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-sql",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
base64 = "0.23"
futures = "0.3"
markdown = "1.0.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
parking_lot = "0.12"
percent-encoding = "2.3"
tree-sitter-containerfile = "0.9.2"
ureq = "3.5"
url = "2.5"

[[test]]
name = "shots"
harness = false

[[test]]
name = "drive"
harness = false

[build-dependencies]
sha2 = "0.11"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
detached-core = { workspace = true, features = ["testutil", "e2e"] }
detached-forge-fake = { path = "../forge-fake" }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
semver = "1"
tempfile.workspace = true
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[package.metadata.packager]
product-name = "Detached"
identifier = "com.w-devs.detached"
# The deb's Maintainer, without which dpkg warns on every run.
authors = ["w-devs.com"]
binaries = [{ path = "detached", main = true }, { path = "detached-cli", main = false }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
category = "DeveloperTool"
macos = { minimum-system-version = "15.0" }
nsis = { installer-mode = "currentUser", installer-icon = "icons/icon.ico" }
# The binary's NEEDED libraries, and the Vulkan loader, which wgpu opens with dlopen.
deb = { depends = ["libc6", "libgcc-s1", "libfreetype6", "libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1"] }
# Code and Markdown files open in Detached from Finder, Explorer and the file manager. The macOS rank is set in scripts/package.sh.
file-associations = [
  { name = "Markdown", description = "Markdown file", mime-type = "text/markdown", extensions = ["md", "markdown"] },
  { name = "Text", description = "Text file", mime-type = "text/plain", extensions = ["txt"] },
  { name = "TypeScript", description = "TypeScript file", mime-type = "text/x-typescript", extensions = ["ts", "tsx"] },
  { name = "JavaScript", description = "JavaScript file", mime-type = "text/javascript", extensions = ["js", "jsx", "mjs", "cjs"] },
  { name = "JSON", description = "JSON file", mime-type = "application/json", extensions = ["json", "jsonc"] },
  { name = "YAML", description = "YAML file", mime-type = "application/yaml", extensions = ["yaml", "yml"] },
  { name = "TOML", description = "TOML file", mime-type = "application/toml", extensions = ["toml"] },
  { name = "Rust", description = "Rust file", mime-type = "text/rust", extensions = ["rs"] },
  { name = "Python", description = "Python file", mime-type = "text/x-python", extensions = ["py"] },
  { name = "Go", description = "Go file", mime-type = "text/x-go", extensions = ["go"] },
  { name = "Java", description = "Java file", mime-type = "text/x-java", extensions = ["java"] },
  { name = "Kotlin", description = "Kotlin file", mime-type = "text/x-kotlin", extensions = ["kt"] },
  { name = "Swift", description = "Swift file", mime-type = "text/x-swift", extensions = ["swift"] },
  { name = "C", description = "C file", mime-type = "text/x-csrc", extensions = ["c", "h"] },
  { name = "Cpp", description = "C++ file", mime-type = "text/x-c++src", extensions = ["cpp", "hpp"] },
  { name = "CSharp", description = "C# file", mime-type = "text/x-csharp", extensions = ["cs"] },
  { name = "Ruby", description = "Ruby file", mime-type = "application/x-ruby", extensions = ["rb"] },
  { name = "PHP", description = "PHP file", mime-type = "application/x-php", extensions = ["php"] },
  { name = "Shell", description = "Shell file", mime-type = "application/x-shellscript", extensions = ["sh", "zsh", "bash", "fish"] },
  { name = "CSS", description = "CSS file", mime-type = "text/css", extensions = ["css", "scss"] },
  { name = "HTML", description = "HTML file", mime-type = "text/html", extensions = ["html"] },
  { name = "XML", description = "XML file", mime-type = "application/xml", extensions = ["xml"] },
  { name = "SQL", description = "SQL file", mime-type = "application/sql", extensions = ["sql"] },
  { name = "Vue", description = "Vue and Svelte file", extensions = ["vue", "svelte"] },
  { name = "Lua", description = "Lua file", mime-type = "text/x-lua", extensions = ["lua"] },
  { name = "Dart", description = "Dart file", mime-type = "application/vnd.dart", extensions = ["dart"] },
]
