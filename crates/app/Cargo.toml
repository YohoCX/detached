[package]
name = "detached-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "detached"

[[bin]]
name = "detached"
path = "src/main.rs"

[dependencies]
detached-core.workspace = true
serde.workspace = true
serde_json.workspace = true
# The grammars of the languages the viewer maps file names to.
gpui-kit = { version = "=0.9.0", features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-elixir",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-sql",
    "tree-sitter-swift",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
base64 = "0.23"
futures = "0.3"
markdown = "1.0.0"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
minisign-verify = "0.3"
percent-encoding = "2.3"
semver = { version = "1", features = ["serde"] }
tempfile.workspace = true
tree-sitter = "0.26"
tree-sitter-containerfile = "0.9.2"
ureq = "3.5"
alacritty_terminal = "0.26"
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
detached-core = { workspace = true, features = ["testutil", "e2e"] }
detached-forge-fake = { path = "../forge-fake" }
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
minisign = "0.10"

[package.metadata.packager]
product-name = "Detached"
identifier = "dev.wdevs.detached"
# The deb's Maintainer, without which dpkg warns on every run.
authors = ["wdevs"]
binaries = [{ path = "detached", main = true }]
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
category = "DeveloperTool"
macos = { minimum-system-version = "15.0" }
nsis = { installer-mode = "currentUser", installer-icon = "icons/icon.ico" }
# The binary's NEEDED libraries, and the Vulkan loader, which wgpu opens with dlopen.
deb = { depends = ["libc6", "libgcc-s1", "libfreetype6", "libxcb1", "libxkbcommon0", "libxkbcommon-x11-0", "libvulkan1"] }
