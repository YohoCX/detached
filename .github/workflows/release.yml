# A v* tag builds macOS, Windows and Linux and publishes the release; a manual run only builds.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Also caches ~/.cargo/bin, so cargo-packager is installed once.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # libghostty-vt is built from its release's source with Zig on Linux and Windows, uncached.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: runner.os != 'macOS'
        with:
          version: 0.17.1
          use-cache: false

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libzstd-dev

      # Every release is signed with the same "Detached Dev" identity, or Keychain access breaks on update.
      - name: Import signing identity
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          [ -n "$CERT" ] || { echo "::error::Set the MACOS_CERTIFICATE secret (see README)."; exit 1; }
          kc=$RUNNER_TEMP/signing.keychain-db
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security create-keychain -p ci "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p ci "$kc"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$kc"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Detached Dev" -p "$kc" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"

      - run: scripts/package.sh

      # package.sh falls back to an ad-hoc signature, which a release must not ship.
      - name: Check signature
        if: runner.os == 'macOS'
        run: |
          for app in target/package/arm64/Detached.app target/package/x64/Detached.app; do
            codesign --verify --deep --strict "$app"
            codesign -dvv "$app" 2>&1 | grep 'Authority=Detached Dev'
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ runner.os }}
          path: target/package/Detached-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      # latest.json, which core's update.rs reads, and minisign signatures of it and of the packages.
      - name: Sign
        env:
          SECRET: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME, but Cargo.toml says $version."; exit 1; }
          key=$(sed -n 's/^pub const PUBLIC_KEY: &str = "\(.*\)";$/\1/p' crates/core/src/update.rs)
          [ -n "$key" ] || { echo "::error::Set PUBLIC_KEY in crates/core/src/update.rs (see README)."; exit 1; }
          [ -n "$SECRET" ] || { echo "::error::Set the UPDATE_SIGNING_KEY secret (see README)."; exit 1; }
          sudo apt-get update
          sudo apt-get install -y minisign

          printf '%s\n' "$SECRET" > "$RUNNER_TEMP/release.key"
          minisign -S -s "$RUNNER_TEMP/release.key" -m out/*
          scripts/latest-json.sh "$version" "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" out > out/latest.json
          minisign -S -s "$RUNNER_TEMP/release.key" -m out/latest.json
          rm "$RUNNER_TEMP/release.key"
          # A secret that does not match the key compiled in would make every update fail.
          for sig in out/*.minisig; do minisign -V -q -P "$key" -m "${sig%.minisig}"; done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Detached ${GITHUB_REF_NAME#v}" \
            --generate-notes out/* scripts/install.sh
