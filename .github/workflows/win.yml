# The Windows fix loop: a push to win/** runs Check's Windows job and Agent's native Windows job
# (its WSL pass included), or with a WIN_TESTS file only its lines, `check <cargo test args>` or
# `agent <args of scripts/agent-ci.sh>`. Job ids and rust-cache inputs are Check's and Agent's, so
# a run restores main's caches; it saves none.
name: Win

on:
  push:
    branches: ['win/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --no-self-update
      - run: echo "GHOSTTY_VT_DIR=$RUNNER_TEMP/ghostty-vt" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('crates/app/build.rs') }}
          save-if: false
          cache-directories: ${{ runner.temp }}/ghostty-vt
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
          use-cache: false
      - run: command -v make || choco install make --no-progress -y
      - run: echo "RUST_TEST_THREADS=$(nproc)" >> "$GITHUB_ENV"
      - run: |
          if [ ! -f WIN_TESTS ]; then make check; make smoke; exit; fi
          sed -n 's/^check //p' WIN_TESTS | while read -r args; do eval "cargo test $args" </dev/null; done

  native:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-latest
          save-if: false
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates perl
      - run: echo "RUST_TEST_THREADS=$(nproc)" >> "$GITHUB_ENV"
      - env:
          WSL: Ubuntu-24.04
        run: |
          if [ ! -f WIN_TESTS ]; then ./scripts/agent-ci.sh; exit; fi
          sed -n 's/^agent //p' WIN_TESTS | while read -r args; do eval "./scripts/agent-ci.sh $args" </dev/null; done
