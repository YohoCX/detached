# The agent harness on every OS (scripts/agent-ci.sh): the tests on the fake ACP agent and the fake
# CLI, then the official `claude` on a scripted fake Messages API through the direct backend; on
# Windows again with the CLI in a WSL distro, the product's WSL shape.
# No model call and no secret: the fake answers the CLI, and its other HTTPS goes to a dead proxy.
# agent-vet.yml calls it with `cli` and `ref` to vet a `claude` at main or at a release tag, on that
# tree's own tests.
name: Agent

on:
  push:
    # Branches alone, so a tag push does not run it; win.yml runs win/**.
    branches: ['**', '!win/**']
    paths:
      - crates/acp/**
      - crates/core/src/adapters.rs
      - crates/core/src/adapters/**
      - crates/core/src/backend.rs
      - crates/core/src/bin/fake_claude.rs
      - crates/core/src/claude*
      - crates/core/src/claude/**
      - crates/core/src/env.rs
      - crates/core/src/git/testutil.rs
      - crates/core/src/os.rs
      - crates/core/src/council.rs
      - crates/core/src/council/**
      - crates/core/src/proc.rs
      - crates/core/src/proc/**
      - crates/core/src/testutil/**
      - crates/core/src/trust.rs
      - crates/core/src/update.rs
      - crates/core/src/update/**
      - crates/kernel/src/host.rs
      - crates/kernel/src/host/**
      - crates/kernel/src/lib.rs
      - crates/kernel/src/council.rs
      - crates/kernel/src/council/**
      - crates/kernel/src/session.rs
      - crates/kernel/src/session/**
      - adapters/adapters.json
      - Cargo.lock
      - scripts/agent-ci.sh
      - .github/workflows/agent.yml
  workflow_dispatch:
    inputs:
      latest:
        description: The newest claude
        type: boolean
        default: false
      cli:
        description: The claude to run, a version, floor or latest; else the pinned one
        type: string
        default: ''
  workflow_call:
    inputs:
      latest:
        type: boolean
        default: false
      cli:
        description: The claude to run, a version, floor or latest; else the pinned one
        type: string
        default: ''
      ref:
        description: The tree to test; else the one that called
        type: string
        default: ''

permissions:
  contents: read

# The inputs too, so agent-vet.yml's legs do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}-${{ inputs.cli }}-${{ inputs.latest }}
  cancel-in-progress: true

env:
  LATEST: ${{ inputs.latest && '1' || '' }}
  CLI: ${{ inputs.cli }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install --no-self-update
      # Per image: 22.04 and 24.04 are both Linux to rust-cache, and their C objects differ.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && inputs.ref == '' }}
      # The product's WSL shape: the stock distro, which mounts the runner's drives.
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        if: runner.os == 'Windows'
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: curl ca-certificates perl

      # GPUI's libraries for the kernel's tests, and the CLI sandbox's bubblewrap and socat.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev \
            libzstd-dev libvulkan1 bubblewrap socat
      # 24.04 refuses bwrap's user namespaces until it has a profile of its own.
      - name: bwrap's AppArmor profile
        if: matrix.os == 'ubuntu-24.04'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' \
            | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / true
      - run: echo "RUST_TEST_THREADS=$(nproc 2>/dev/null || sysctl -n hw.ncpu)" >> "$GITHUB_ENV"

      - run: ./scripts/agent-ci.sh
        env:
          WSL: ${{ runner.os == 'Windows' && 'Ubuntu-24.04' || '' }}

  # The Linux sandbox inside WSL2 on the Windows runner, built there, in WSL's own filesystem.
  wsl2:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          # Not root: the CLI refuses bypassPermissions to root.
          wsl-shell-user: ci
          additional-packages: >-
            build-essential pkg-config git perl curl ca-certificates unzip jq make python3
            bubblewrap socat libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
            libzstd-dev libvulkan1
      - shell: wsl-bash {0}
        env:
          WSLENV: LATEST:CLI
        run: |
          set -eu
          mkdir -p ~/detached
          tar -C "$(wslpath '${{ github.workspace }}')" --exclude=./target -cf - . | tar -C ~/detached -xf -
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          export PATH=$HOME/.cargo/bin:$PATH RUST_TEST_THREADS=$(nproc)
          cd ~/detached
          # A release tag from before rust-toolchain.toml builds on stable.
          [ -f rust-toolchain.toml ] || rustup default stable
          rustup toolchain install --no-self-update
          ./scripts/agent-ci.sh
