# Agent adapters.
# - An adapters-<name>-<version> tag builds that adapter with bun per platform into a release of its
#   own with an entry.json, then the catalog job adds every such entry the catalog lacks.
# - The catalog job signs adapters/adapters.json with ADAPTERS_SIGNING_KEY unless its committed
#   signature already holds, commits it to main and publishes it to the rolling `adapters` release,
#   the URL core's CATALOG_URL names. It runs on main and on those tags, in the `adapters`
#   environment. Neither release is marked latest: the app's updater reads the latest release.
name: Adapters

on:
  push:
    branches: [main]
    paths: [adapters/adapters.json, adapters/adapters.json.minisig]
    tags: ['adapters-*']
  workflow_dispatch:

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/adapters-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-aarch64, bun: bun-darwin-arm64 }
          - { os: macos-latest, target: macos-x86_64, bun: bun-darwin-x64 }
          - { os: ubuntu-22.04, target: linux-x86_64-gnu, bun: bun-linux-x64 }
          - { os: windows-latest, target: windows-x86_64, bun: bun-windows-x64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      COPYFILE_DISABLE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g bun@1.4.4
      - name: Build
        run: |
          tag=${GITHUB_REF_NAME#adapters-}; name=${tag%-*}; version=${tag##*-}
          grep -q "\"@agentclientprotocol/$name\":\"$version\"" "adapters/$name/package.json" \
            || { echo "::error::adapters/$name/package.json does not pin $version."; exit 1; }
          ./scripts/adapter-build.sh "$name" ${{ matrix.bun }}
          mv "adapters/$name/out.tar.gz" "adapters/$name/$name-$version-${{ matrix.target }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: adapters/*/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Entry
        run: |
          tag=${GITHUB_REF_NAME#adapters-}; name=${tag%-*}; version=${tag##*-}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          app=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          artifacts='{}'
          for f in out/*.tar.gz; do
            file=${f#out/}; target=${file#"$name-$version-"}; target=${target%.tar.gz}
            artifacts=$(jq --arg t "$target" --arg url "$base/$file" --argjson size "$(wc -c < "$f")" \
              --arg sha "$(sha256sum "$f" | cut -d' ' -f1)" \
              '. + {($t): {url: $url, size: $size, sha256: $sha}}' <<< "$artifacts")
          done
          jq -n --arg name "$name" --arg version "$version" --arg published "$(date -u +%F)" \
            --arg app "$app" --argjson artifacts "$artifacts" \
            '{name: $name, version: $version, published: $published, min_app: $app,
              min_cli: null, blocked_cli: [], artifacts: $artifacts}' > out/entry.json
          cat out/entry.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --latest=false \
            --title "Adapter ${GITHUB_REF_NAME#adapters-}" \
            --notes "The catalog job adds entry.json to the signed catalog." \
            out/*.tar.gz out/entry.json

  catalog:
    needs: release
    if: ${{ !cancelled() && !github.event.repository.fork && (github.ref == 'refs/heads/main' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    environment: adapters
    concurrency: adapters-catalog
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Every adapters-* release's entry that the catalog lacks goes in, so a cancelled run is caught
      # by the next one; an entry leaves the catalog with its release.
      - name: Sign
        env:
          SECRET: ${{ secrets.ADAPTERS_SIGNING_KEY }}
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main; the catalog is signed only from main."; exit 1; }
          catalog=adapters/adapters.json
          key=$(sed -n 's/^pub const CATALOG_KEY: &str = "\(.*\)";$/\1/p' crates/core/src/adapters.rs)
          [ -n "$key" ] || { echo "::error::Set CATALOG_KEY in crates/core/src/adapters.rs."; exit 1; }
          echo "key=$key" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          entries=$RUNNER_TEMP/entries.json
          : > "$entries"
          for tag in $(gh release list --limit 1000 --json tagName -q '.[].tagName | select(startswith("adapters-"))'); do
            gh release download "$tag" -p entry.json -O - >> "$entries" || echo "::warning::$tag has no entry.json."
          done
          jq --slurpfile e "$entries" '.adapters as $a | .adapters += [$e[] | select(. as $x |
            $a | all(.name != $x.name or .version != $x.version))]' "$catalog" > "$RUNNER_TEMP/catalog.json"
          mv "$RUNNER_TEMP/catalog.json" "$catalog"
          if git diff --quiet "$catalog" && [ -f "$catalog.minisig" ] && minisign -V -q -P "$key" -m "$catalog"; then
            exit 0
          fi
          [ -n "$SECRET" ] || { echo "::error::Set ADAPTERS_SIGNING_KEY in the adapters environment (docs/decisions/2026-11-17-catalog-signed-in-ci.md)."; exit 1; }
          dir=$RUNNER_TEMP/key
          mkdir -m 700 "$dir"
          printf '%s\n' "$SECRET" > "$dir/adapters.key"
          printf 'untrusted comment: CATALOG_KEY\n%s\n' "$key" > "$dir/adapters.pub"
          # The key has an empty password, which minisign reads from a stdin that is not a terminal.
          echo | DETACHED_ADAPTERS_KEY_DIR=$dir scripts/adapters-sign.sh
          rm -r "$dir"
      - name: Check
        run: |
          catalog=adapters/adapters.json
          minisign -V -q -P "$key" -m "$catalog"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/adapters/adapters.json"
          if published=$(curl -fsSL "$url"); then
            old=$(jq .serial <<< "$published")
            [ "$(jq .serial "$catalog")" -ge "$old" ] || { echo "::error::The serial is below the published $old."; exit 1; }
          fi
          jq -r '.adapters[].artifacts[] | "\(.url) \(.size) \(.sha256)"' "$catalog" |
            while read -r u size sha; do
              curl -fsSL -o "$RUNNER_TEMP/a" "$u"
              [ "$(wc -c < "$RUNNER_TEMP/a")" = "$size" ] && [ "$(sha256sum "$RUNNER_TEMP/a" | cut -d' ' -f1)" = "$sha" ] \
                || { echo "::error::$u does not match its size or sha256."; exit 1; }
            done
      - name: Publish
        run: |
          git add adapters/adapters.json adapters/adapters.json.minisig
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Adapters catalog signed at serial $(jq .serial adapters/adapters.json)"
            git push origin HEAD:main
          fi
          gh release view adapters > /dev/null 2>&1 || gh release create adapters --prerelease --latest=false \
            --title "Adapters catalog" --notes "The signed adapters.json that Detached reads."
          gh release upload adapters adapters/adapters.json adapters/adapters.json.minisig --clobber
