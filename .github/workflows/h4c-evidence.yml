# H4c part 0 (PLAN-AGENT-HOST, step H4c): spikes/claude-direct's rows on every OS of §17 and in the
# product's WSL shape, at Claude's min_cli and at the latest `claude`. agent.yml runs first as the
# baseline. No model call and no secret: the CLI talks to the spike's scripted fake Messages API,
# and its other HTTPS goes to a dead proxy. Row 9 is the owner's machine alone and never runs here.
name: H4c evidence

on:
  push:
    paths:
      - spikes/claude-direct/**
      - '!spikes/claude-direct/**/*.md'
      - crates/core/src/testutil/api.rs
      - .github/workflows/h4c-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    uses: ./.github/workflows/agent.yml

  versions:
    runs-on: ubuntu-latest
    outputs:
      min: ${{ steps.v.outputs.min }}
      clis: ${{ steps.v.outputs.clis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Claude's manifest is the first `min_cli` in the file.
      - id: v
        run: |
          min=$(grep -m1 -o 'min_cli: Version::new([0-9, ]*)' crates/core/src/adapters.rs | tr -dc '0-9,' | tr , .)
          [ -n "$min" ] || { echo "::error::No min_cli in crates/core/src/adapters.rs."; exit 1; }
          echo "min=$min" >> "$GITHUB_OUTPUT"
          echo "clis=[\"$min\", \"latest\"]" >> "$GITHUB_OUTPUT"

  native:
    needs: [baseline, versions]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, ubuntu-24.04, windows-latest]
        cli: ${{ fromJSON(needs.versions.outputs.clis) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # Row 11 installs the floor itself, once per OS.
      ROWS: ${{ matrix.cli == needs.versions.outputs.min && 'all floor' || 'all' }}
      SPIKE_FLOOR: ${{ needs.versions.outputs.min }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The sandbox of the isolated row.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      # 24.04 refuses bwrap's user namespaces until it has a profile of its own.
      - name: bwrap's AppArmor profile
        if: matrix.os == 'ubuntu-24.04'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' \
            | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / true
      - run: ./spikes/claude-direct/ci.sh '${{ matrix.cli }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: h4c-${{ matrix.os }}-${{ matrix.cli }}
          path: spikes/claude-direct/out

  # The CLI and the spike both inside WSL2 on the Windows runner, in WSL's own filesystem.
  wsl2:
    needs: [baseline, versions]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.versions.outputs.clis) }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: build-essential pkg-config git perl curl ca-certificates bubblewrap socat
      - shell: wsl-bash {0}
        run: |
          set -eu
          ws=$(wslpath '${{ github.workspace }}')
          mkdir -p ~/detached
          tar -C "$ws" --exclude=./target -cf - . | tar -C ~/detached -xf -
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH=$HOME/.cargo/bin:$PATH
          status=0
          ROWS='${{ matrix.cli == needs.versions.outputs.min && 'all floor' || 'all' }}' SPIKE_FLOOR='${{ needs.versions.outputs.min }}' \
            ~/detached/spikes/claude-direct/ci.sh '${{ matrix.cli }}' || status=$?
          cp -r ~/detached/spikes/claude-direct/out "$ws/spikes/claude-direct/"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: h4c-wsl2-${{ matrix.cli }}
          path: spikes/claude-direct/out

  # The product's WSL shape: the spike on Windows, `wsl.exe`, the CLI in the distro under the leash.
  wsl-shape:
    needs: [baseline, versions]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        cli: ${{ fromJSON(needs.versions.outputs.clis) }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: git perl curl ca-certificates bubblewrap socat
      - shell: wsl-bash {0}
        run: |
          set -eu
          curl -fsSL https://claude.ai/install.sh | bash -s '${{ matrix.cli }}'
          have=$(~/.local/bin/claude --version)
          echo "claude $have"
          [ '${{ matrix.cli }}' = latest ] || [ "${have%% *}" = '${{ matrix.cli }}' ] || { echo "::error::claude is $have, not ${{ matrix.cli }}."; exit 1; }
      - run: cargo build --manifest-path spikes/claude-direct/Cargo.toml
      # In NAT mode the distro reaches the host only on its gateway address, through this rule.
      - shell: pwsh
        run: |
          $spike = "$env:GITHUB_WORKSPACE\spikes\claude-direct\target\debug\claude-direct-spike.exe"
          New-NetFirewallRule -DisplayName h4c-spike -Direction Inbound -Program $spike -Action Allow | Out-Null
      - env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ENV_CONV_EXCL: '*'
          SPIKE_WSL: Ubuntu-24.04
          SPIKE_WSL_CLAUDE: /root/.local/bin/claude
        run: |
          SPIKE_WSL_HOST=$(wsl.exe -d Ubuntu-24.04 -- ip route show default | cut -d' ' -f3)
          export SPIKE_WSL_HOST
          echo "the gateway: $SPIKE_WSL_HOST"
          cd spikes/claude-direct
          mkdir -p out
          ./target/debug/claude-direct-spike wsl 2>&1 | tee out/answers.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: h4c-wsl-shape-${{ matrix.cli }}
          path: spikes/claude-direct/out
