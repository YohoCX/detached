# Agent-host spike 0b only: the bun-built Claude adapter and the official `claude` on Linux and
# Windows, on a scripted fake Messages API. No model calls and no secrets: real turns run on the
# owner's Mac only.
name: ACP spike 0b

on:
  push:
    branches: [agent-host/0-spikes]
    paths: [spikes/acp/**, .github/workflows/acp-spike-0b.yml]
  workflow_dispatch:

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SPIKE: ${{ github.workspace }}/spikes/acp/target/debug/acp-spike
      ADAPTER: ${{ github.workspace }}/spikes/acp/adapter/claude-agent-acp
      CLAUDE: /home/runner/.local/bin/claude
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tools
        run: |
          curl -fsSL https://bun.sh/install | bash -s bun-v1.4.4
          curl -fsSL https://claude.ai/install.sh | bash
          readlink -f "$CLAUDE"; "$CLAUDE" --version
      - name: Adapter
        working-directory: spikes/acp/adapter
        run: |
          ~/.bun/bin/bun install --frozen-lockfile --omit optional
          ~/.bun/bin/bun build --compile node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js --outfile claude-agent-acp
          ls -la claude-agent-acp
      - run: cargo build --manifest-path spikes/acp/Cargo.toml
      - name: Kernel and packages
        run: |
          uname -r; cat /etc/os-release | grep VERSION=
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true
          which bwrap socat || true
          dpkg -l bubblewrap socat 2>&1 | tail -2 || true
      - name: Row 7, Codex's sandbox
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" --no-fund --no-audit @openai/codex@0.166.0 > /dev/null
          export CODEX=$(find "$RUNNER_TEMP/codex/node_modules/@openai" -type f -name codex -path '*vendor*' | head -1)
          "$CODEX" --version
          . spikes/acp/0b/lib.sh && codex_sandbox
      - name: Row 1, lifecycle
        run: . spikes/acp/0b/lib.sh && lifecycle
      - name: Rows 5 and 6, host tools
        run: . spikes/acp/0b/lib.sh && mcp
      - name: Row 2, sandbox without bubblewrap or socat
        run: |
          sudo apt-get remove -y -qq bubblewrap socat > /dev/null 2>&1 || true
          . spikes/acp/0b/lib.sh && attack none true '{"strictAllowlist": true}'
      - name: Row 2, socat only
        run: |
          sudo apt-get install -y -qq socat > /dev/null
          . spikes/acp/0b/lib.sh && attack socat true '{"strictAllowlist": true}'
      - name: Row 2, bubblewrap only
        run: |
          sudo apt-get remove -y -qq socat > /dev/null; sudo apt-get install -y -qq bubblewrap > /dev/null
          bwrap --ro-bind / / true && echo "bwrap alone: ok" || echo "bwrap alone: failed"
          . spikes/acp/0b/lib.sh && attack bwrap true '{"strictAllowlist": true}'
      - name: Rows 2 and 3, bubblewrap and socat
        run: |
          sudo apt-get install -y -qq socat > /dev/null
          . spikes/acp/0b/lib.sh && attack both true '{"strictAllowlist": true}'
      - name: Row 2, the AppArmor profile fix
        if: matrix.os == 'ubuntu-24.04'
        run: |
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --ro-bind / / true && echo "bwrap alone: ok" || echo "bwrap alone: failed"
          . spikes/acp/0b/lib.sh && attack profile true '{"strictAllowlist": true}'
      - name: Row 3, the shared temp dir denied
        run: |
          . spikes/acp/0b/lib.sh
          export PASS=CLAUDE_CODE_TMPDIR CLAUDE_CODE_TMPDIR=$RUNNER_TEMP/tmpbase EXTRA_DENY=/tmp/claude-$(id -u)
          mkdir -p "$CLAUDE_CODE_TMPDIR"; attack tmp true '{"strictAllowlist": true}'
      - name: Row 4, autoAllowBashIfSandboxed off, no strictAllowlist
        run: . spikes/acp/0b/lib.sh && attack off false
      - name: Linux binaries for WSL
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: |
            spikes/acp/target/debug/acp-spike
            spikes/acp/adapter/claude-agent-acp

  windows:
    needs: linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      SPIKE: ${{ github.workspace }}/spikes/acp/target/debug/acp-spike.exe
      ADAPTER: ${{ github.workspace }}\spikes\acp\adapter\claude-agent-acp.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tools
        shell: pwsh
        run: |
          npm install -g bun@1.4.4
          irm https://claude.ai/install.ps1 | iex
          & "$env:USERPROFILE\.local\bin\claude.exe" --version
          "CLAUDE=$env:USERPROFILE\.local\bin\claude.exe" >> $env:GITHUB_ENV
      - name: Adapter
        working-directory: spikes/acp/adapter
        run: |
          bun install --frozen-lockfile --omit optional
          bun build --compile node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js --outfile claude-agent-acp.exe
      - run: cargo build --manifest-path spikes/acp/Cargo.toml
      - name: Row 1, lifecycle without a job object
        continue-on-error: true
        run: . spikes/acp/0b/lib.sh && lifecycle
      - name: Row 1, lifecycle with a job object
        continue-on-error: true
        run: . spikes/acp/0b/lib.sh && JOB=1 lifecycle
      - name: Row 10, the sandbox natively
        continue-on-error: true
        run: |
          . spikes/acp/0b/lib.sh && setup native
          META='{"claudeCode":{"options":{"tools":["Read","Bash"],"sandbox":{"enabled":true,"failIfUnavailable":true,"allowUnsandboxedCommands":false}}}}' \
            MODE=default PERM=allow FAKE=spikes/acp/0b/echo.json "$SPIKE" run go 2>&1 | grep -E "prompt ->|ERROR" | cut -c1-600
      - name: Row 10, the gated native Windows sandbox (internal override, not a release feature)
        continue-on-error: true
        run: |
          . spikes/acp/0b/lib.sh && setup kestrel
          printf '[[{"tool":"Bash","input":{"command":"echo x > w1.txt; ls w1.txt","description":"a"}}],[{"tool":"Bash","input":{"command":"echo x > ~/w3-spike.txt; ls ~/w3-spike.txt; rm -f ~/w3-spike.txt","description":"b"}}],[{"tool":"Bash","input":{"command":"cat ~/.gitconfig | head -1","description":"c"}}],[{"tool":"Bash","input":{"command":"curl -sS -m 8 -o /dev/null -w %%{http_code} https://example.com","description":"d"}}]]' > "$RUNNER_TEMP/k.json"
          export PASS=CLAUDE_CODE_NANKEEN_KESTREL CLAUDE_CODE_NANKEEN_KESTREL=1
          "$CLAUDE" sandbox install 2>&1 | tail -3
          META="{\"claudeCode\":{\"options\":{\"tools\":[\"Read\",\"Bash\"],\"sandbox\":{\"enabled\":true,\"failIfUnavailable\":true,\"autoAllowBashIfSandboxed\":true,\"allowUnsandboxedCommands\":false,\"filesystem\":{\"denyWrite\":[\"$(cygpath -m "$RUN/repo")\"],\"denyRead\":[\"$(cygpath -m ~/.gitconfig)\"]},\"network\":{\"strictAllowlist\":true}}}}}" \
            MODE=default PERM=allow FAKE=$RUNNER_TEMP/k.json "$SPIKE" run go 2>&1 | grep -E "PERMISSION|prompt ->|ERROR" | cut -c1-600
          python "$(cygpath -w spikes/acp/0b/results.py)" "$LOG.api"; ls "$RUN/repo"
          tail -20 "$LOG.stderr" | cut -c1-300
      - name: WSL facts
        continue-on-error: true
        shell: pwsh
        run: |
          systeminfo | Select-String -Pattern "OS Name|OS Version|Hyper-V|Virtualization|Second Level"
          Get-CimInstance Win32_Processor | Select-Object Name, VirtualizationFirmwareEnabled, SecondLevelAddressTranslationExtensions
          foreach ($f in "VirtualMachinePlatform", "Microsoft-Windows-Subsystem-Linux", "Microsoft-Hyper-V") { Get-WindowsOptionalFeature -Online -FeatureName $f | Select-Object FeatureName, State }
      - uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        id: wsl
        continue-on-error: true
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: bubblewrap socat git perl curl ca-certificates python3 ripgrep
      - name: WSL version
        continue-on-error: true
        shell: pwsh
        run: |
          wsl --version; wsl --status; wsl -l -v
          wsl -d Ubuntu-24.04 -- uname -a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.wsl.outcome == 'success'
        with:
          name: linux-x64
          path: ${{ runner.temp }}/linux
      - name: Rows 10 and 1 in WSL
        continue-on-error: true
        if: steps.wsl.outcome == 'success'
        shell: wsl-bash {0}
        run: |
          L=$(wslpath '${{ runner.temp }}')/linux; mkdir -p ~/bin; cp $L/target/debug/acp-spike $L/adapter/claude-agent-acp ~/bin/ 2>/dev/null || cp $(find $L -name acp-spike) $(find $L -name claude-agent-acp) ~/bin/
          chmod +x ~/bin/*; ls -la ~/bin
          curl -fsSL https://claude.ai/install.sh | bash
          export SPIKE=~/bin/acp-spike ADAPTER=~/bin/claude-agent-acp CLAUDE=~/.local/bin/claude RUNS=~/runs
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true
          bwrap --ro-bind / / true && echo "bwrap alone: ok" || echo "bwrap alone: failed"
          . "$(wslpath '${{ github.workspace }}')/spikes/acp/0b/lib.sh"
          lifecycle; attack wsl true '{"strictAllowlist": true}'
      - name: Row 11, a scripted review workload in WSL's filesystem and on /mnt
        continue-on-error: true
        if: steps.wsl.outcome == 'success'
        shell: wsl-bash {0}
        run: |
          set +e
          W=$(wslpath '${{ runner.temp }}')/git-win
          git clone -q --depth 30 https://github.com/git/git ~/git-wsl
          git clone -q --depth 30 https://github.com/git/git "$W"
          for d in ~/git-wsl "$W"; do
            echo "== $d"; cd "$d"
            for i in 1 2 3; do
              /usr/bin/time -f "  git diff HEAD~20 %es" git diff HEAD~20 > /dev/null
              /usr/bin/time -f "  git status %es" git status -s > /dev/null
              /usr/bin/time -f "  rg %es" rg -c strbuf_addf > /dev/null
              /usr/bin/time -f "  read all %es" sh -c 'git ls-files -z | xargs -0 cat > /dev/null 2>&1'
            done
          done
      - name: Row 12, Windows listeners seen from WSL (NAT)
        continue-on-error: true
        if: steps.wsl.outcome == 'success'
        shell: pwsh
        run: |
          $lo = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 47123); $lo.Start()
          $any = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 47125); $any.Start()
          $p = wsl -d Ubuntu-24.04 -- wslpath -a ($env:GITHUB_WORKSPACE.Replace('\', '/') + "/spikes/acp/0b/reach.sh")
          "loopback-bound:"; wsl -d Ubuntu-24.04 -- bash $p 47123
          "bound to all interfaces:"; wsl -d Ubuntu-24.04 -- bash $p 47125
          New-NetFirewallRule -DisplayName spike0b-wsl -Direction Inbound -LocalPort 47125 -Protocol TCP -Action Allow | Out-Null
          "all interfaces, with a firewall rule:"; wsl -d Ubuntu-24.04 -- bash $p 47125
          Remove-NetFirewallRule -DisplayName spike0b-wsl
          $lo.Stop(); $any.Stop()
      - name: Row 12, the adapter in WSL over stdio, host on Windows (NAT)
        continue-on-error: true
        if: steps.wsl.outcome == 'success'
        env:
          MSYS_NO_PATHCONV: 1
          MSYS2_ENV_CONV_EXCL: '*'
        run: |
          . spikes/acp/0b/lib.sh
          export WSLENV=ANTHROPIC_BASE_URL/u:ANTHROPIC_API_KEY/u PASS=WSLENV,MSYS_NO_PATHCONV,MSYS2_ENV_CONV_EXCL
          gw=$(wsl.exe -d Ubuntu-24.04 -- ip route show default | cut -d' ' -f3); echo "gateway $gw"
          run() {
            META='{"claudeCode":{"options":{"settingSources":[],"strictMcpConfig":true,"allowedTools":["mcp__detached-host-abc123__*"]}}}' \
              ADAPTER="wsl.exe -d Ubuntu-24.04 -- env CLAUDE_CODE_EXECUTABLE=/root/.local/bin/claude /root/bin/claude-agent-acp" \
              CWD=/root MCP=http MCP_NAME=detached-host-abc123 MODE=default PERM=deny FAKE=spikes/acp/0b/mcp.json \
              timeout 150 "$SPIKE" run t1 2>&1 | grep -E 'session/new|prompt ->|"http"|"name"|ERROR|TEXT' | cut -c1-250
            echo "exit ${PIPESTATUS[0]}"
          }
          echo "## both on loopback (the CLI in WSL cannot reach the fake API either)"; (setup wslnat; run)
          echo "## both on all interfaces, advertised as the gateway, no firewall rule"; (setup wslgw; FAKE_IP=$gw HOST_IP=$gw run)
          powershell -NoProfile -Command "New-NetFirewallRule -DisplayName spike0b-acp -Direction Inbound -Program '$(cygpath -w "$SPIKE")' -Action Allow | Out-Null"
          echo "## with a firewall rule: the API on the gateway, the host tool on loopback"; (setup wslfwlo; FAKE_IP=$gw run)
          echo "## with a firewall rule: both on the gateway"; (setup wslfw; FAKE_IP=$gw HOST_IP=$gw run)
