# The vetting through agent.yml on every OS: the latest `claude` daily, and its floor on Mondays and
# by hand, through Claude's backend at main and, from 0.6.0 on, at the latest release tag on that
# tag's own tests.
# A scheduled failure opens an issue for the owner, who decides on blocked_cli; nothing is published
# from here.
name: Agent vetting

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # main, and the latest release tag once it has Claude's backend; the CLIs to vet.
  refs:
    runs-on: ubuntu-latest
    outputs:
      legs: ${{ steps.r.outputs.legs }}
      cli: ${{ steps.r.outputs.cli }}
    steps:
      - id: r
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          cli='"latest"'
          if [ "$EVENT" != schedule ] || [ "$(date -u +%u)" = 1 ]; then cli='"floor", "latest"'; fi
          echo "cli=[$cli]" >> "$GITHUB_OUTPUT"
          tag=$(git ls-remote --tags --refs "$REPO" 'v*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          refs='"main"'
          if [ -n "$tag" ] && [ "$(printf '0.6.0\n%s\n' "${tag#v}" | sort -V | head -1)" = 0.6.0 ]; then
            refs="$refs, \"$tag\""
          else
            echo "::notice::The latest release, ${tag:-none}, is older than 0.6.0: main alone."
          fi
          echo "legs=[$refs]" >> "$GITHUB_OUTPUT"

  claude:
    needs: refs
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.refs.outputs.legs) }}
        cli: ${{ fromJSON(needs.refs.outputs.cli) }}
    uses: ./.github/workflows/agent.yml
    with:
      ref: ${{ matrix.ref }}
      cli: ${{ matrix.cli }}

  issue:
    needs: [claude]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The scheduled agent vetting failed"
          body="$RUN failed. If a claude version breaks Claude's backend, add it to blocked_cli in adapters/adapters.json and push; CI signs it."
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
