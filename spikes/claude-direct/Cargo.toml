[package]
name = "claude-direct-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway, outside the app's workspace.
[workspace]

[dependencies]
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
