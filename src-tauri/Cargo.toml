[package]
name = "workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libc = "0.2"
security-framework = "3.7"
ureq = { version = "3.5", features = ["json"] }
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3.27"
