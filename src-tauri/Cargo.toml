[package]
name = "detached"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
default-run = "detached"

[lib]
name = "detached_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# HTTP bridge for the Playwright suite in e2e/.
[[bin]]
name = "e2e-bridge"
required-features = ["e2e"]

[features]
e2e = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
thiserror = "2"
libc = "0.2"
security-framework = "3.7"
ureq = { version = "3.5", features = ["json"] }
ignore = "0.4.34"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
nucleo-matcher = "0.3.1"
tempfile = "3.27"
tauri-plugin-opener = "2"
